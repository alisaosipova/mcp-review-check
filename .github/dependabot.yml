version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # The SDK gets its own PRs: protocol changes can move rule behaviour.
      mcp-sdk:
        patterns: ["@modelcontextprotocol/*"]
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node tracks the oldest supported Node major (engines >=22.12), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The node:22-alpine digest in both Dockerfile stages: update PRs for Node 22 security releases (review round 4
  # I-A08-1). Images pinned inside workflows (registry:2, binfmt, buildkit) are refreshed by hand (docker.yml).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image stays on Node 22, the oldest supported line (engines >=22.12); digests and patch tags only.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
