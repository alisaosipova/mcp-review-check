name: Release

# Push a tag like v0.1.0 (matching package.json) to publish to npm.
# Publishing uses npm trusted publishing (OIDC) only: the trusted publisher is configured on npmjs.com for this
# repository, workflow file "release.yml" and environment "npm" (0.3.0 was the first release published that way).
# No npm token is stored or read anywhere; provenance is attached automatically (publishConfig.provenance is also set).
# The guard job runs first: the tagged commit must be on main and have a green CI run (scripts/release-guard.mjs).
# After the publish, the provenance job checks the attestation's content (scripts/verify-provenance.mjs).
# Only the publish job can mint the OIDC token and only gh-release can write to the repository; neither installs
# dependencies, builds or runs tests: the build job does that without write permissions and hands over the tarball.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # The tag must point at a commit on main that CI passed (a push to main, ci.yml); a CI run still in progress for it
  # is waited for. This catches a tag on the wrong commit (a branch, an unmerged or a red commit). It is no barrier
  # against a hostile tag: a tag push runs the release.yml and scripts/release-guard.mjs of the tagged commit, so a
  # commit that changed them can skip the check; who may push tags and the npm environment guard that.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # the CI runs of the tagged commit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Tagged commit is on main and CI passed on it
        run: node scripts/release-guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      # No dependency install scripts while building the release tarball (see ci.yml).
      - run: npm ci --ignore-scripts
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          MCP_REVIEW_CHECK_SKIP_BUILD: '1'
      - run: npm pack
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: package
          path: mcp-review-check-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      # An exact Node 24 release whose bundled npm (11.19.1, per nodejs.org/dist/index.json on 2026-11-05) supports
      # trusted publishing, which needs npm 11.5.1 or newer. The job that holds id-token: write installs nothing from
      # the registry (review round 4 I-A08-4: it used to install a newer npm globally). Raise it with Node 24 security
      # releases.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.22.2'
          registry-url: https://registry.npmjs.org
      - name: Bundled npm supports trusted publishing (11.5.1 or newer)
        run: |
          v="$(npm --version)"
          echo "npm $v"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$v" || { echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Pre-release tags (v0.2.0-rc.1) go to the "next" dist-tag.
      # Trusted publishing (OIDC): no token in the environment, so npm cannot fall back to a long-lived one.
      - name: Publish to npm (trusted publishing)
        run: npm publish ./mcp-review-check-*.tgz $([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--tag next")
      # The registry must show a provenance attestation for this version; a publish
      # that silently lost provenance (publishConfig ignored, OIDC missing) fails the release before the GitHub
      # release is created. The registry can take several minutes to serve a new version (0.4.0 took over a minute),
      # so retry for up to 10 minutes.
      - name: Published version carries npm provenance
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if npm view "mcp-review-check@$version" --json > view.json 2> view.err &&
               node -e "const d=require('./view.json'); const v=Array.isArray(d)?d[d.length-1]:d; process.exit(v?.dist?.attestations ? 0 : 1)"; then
              echo "mcp-review-check@$version has provenance: $(node -p "JSON.stringify((d=>Array.isArray(d)?d[d.length-1]:d)(require('./view.json')).dist.attestations)")"
              exit 0
            fi
            echo "attempt $attempt: no dist.attestations for mcp-review-check@$version yet"
            sleep 20
          done
          cat view.err
          echo "::error::mcp-review-check@$version has no dist.attestations on the registry: it was published without provenance"
          exit 1

  # What the provenance says, not only that it exists: the repository, release.yml, the tag, the commit and this run,
  # and the sha512 of the tarball the build job made. A job of its own, so the OIDC job runs no repository code.
  provenance:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Provenance names this repository, workflow, commit and run
        run: node scripts/verify-provenance.mjs "$RUNNER_TEMP"/package/mcp-review-check-*.tgz

  gh-release:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--prerelease")
        env:
          GH_TOKEN: ${{ github.token }}
