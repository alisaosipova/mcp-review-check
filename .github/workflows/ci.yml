name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # engines: >=20.19. 20.19 is the oldest supported release; 22 and 24 are the LTS lines.
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          MCP_REVIEW_CHECK_SKIP_BUILD: '1'

  package:
    name: Docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: docs/RULES.md and the catalog date in README.md are regenerated
        run: |
          npm run readme:rules
          git diff --exit-code -- docs/RULES.md README.md || { echo "::error::docs/RULES.md or README.md is stale: run 'npm run build && npm run readme:rules' and commit the result"; exit 1; }
      - name: No known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Pack, install the tarball and run it
        run: |
          rm -rf dist
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/mcp-review-check-*.tgz
          test "$(npx mcp-review-check --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/smoke/node_modules/.bin/mcp-review-check" --stdio "node test/fixtures/good-server.mjs" --format json > "$RUNNER_TEMP/report.json"
          node -e "const r=require(process.argv[1]); if (r.schemaVersion!==1||r.summary.errors!==0) { console.error(r.summary); process.exit(1) }" "$RUNNER_TEMP/report.json"
