name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish, so every main commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # engines: >=22.12. 22 and 24 are the supported LTS lines.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency install scripts: the runtime dependencies have none, and esbuild (vitest) runs from its
      # prebuilt @esbuild/<platform> package without its postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          MCP_REVIEW_CHECK_SKIP_BUILD: '1'

  coverage:
    name: Coverage (Node 24 / ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Fails below the thresholds in vitest.config.ts (5 points under the last full measurement).
      # MCP_REVIEW_CHECK_COVERAGE skips the two tests whose timing V8 instrumentation breaks: the 70 MB stdio overflow
      # (test/remediation-wp2-connect.test.ts) and the wall-clock bound on the input caps (test/limits.test.ts).
      - name: Tests with coverage
        continue-on-error: false
        run: npm run test:coverage
        env:
          MCP_REVIEW_CHECK_SKIP_BUILD: '1'
          MCP_REVIEW_CHECK_COVERAGE: '1'
      # The report also when the thresholds fail (reportOnFailure), to see where coverage dropped.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: docs/RULES.md and the generated rule count, catalog date and version in README.md and docs/design/spec.md are current
        run: |
          npm run readme:rules
          git diff --exit-code -- docs/RULES.md README.md docs/design/spec.md || { echo "::error::docs/RULES.md, README.md or docs/design/spec.md is stale: run 'npm run build && npm run readme:rules' and commit the result"; exit 1; }
      - name: No known vulnerabilities in runtime dependencies
        # A new advisory in a dependency is not the pull request's fault: pull requests skip the audit; pushes to
        # main (and manual runs) run it here, and audit.yml runs it weekly, so an advisory shows up without a push.
        if: github.event_name != 'pull_request'
        run: npm audit --omit=dev --audit-level=high
      - name: Pack, install the shipped tree from the tarball and run it
        run: |
          rm -rf dist
          npm pack --pack-destination "$RUNNER_TEMP"
          # The tarball ships npm-shrinkwrap.json (prepack); postpack removed it from the checkout. No grep -q: under
          # pipefail, grep leaving early could fail tar with SIGPIPE.
          tar -tzf "$RUNNER_TEMP"/mcp-review-check-*.tgz | grep -x package/npm-shrinkwrap.json > /dev/null
          test ! -e "$GITHUB_WORKSPACE/npm-shrinkwrap.json"
          # `npm install <tarball>` ignores a shrinkwrap (only a registry manifest carries _hasShrinkwrap), so it would
          # test whatever the ranges resolve to today. npm ci in the extracted package installs exactly the
          # shrinkwrap, as npx, a global install, the Action and the Docker image do. devDependencies are dropped
          # first: the shrinkwrap has none (a dependency's devDependencies are never installed) and npm ci would
          # call the lock out of sync.
          mkdir "$RUNNER_TEMP/smoke" && tar -xzf "$RUNNER_TEMP"/mcp-review-check-*.tgz -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/package"
          npm pkg delete devDependencies
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          node scripts/check-tree.mjs "$RUNNER_TEMP/smoke/package"
          test "$(node "$RUNNER_TEMP/smoke/package/dist/cli.js" --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          node "$RUNNER_TEMP/smoke/package/dist/cli.js" --stdio "node test/fixtures/good-server.mjs" --format json > "$RUNNER_TEMP/report.json"
          node -e "const r=require(process.argv[1]); if (r.schemaVersion!==1||r.summary.errors!==0) { console.error(r.summary); process.exit(1) }" "$RUNNER_TEMP/report.json"

  pre-commit:
    # The published hook (.pre-commit-hooks.yaml), installed by pre-commit from this commit and run in a fixture
    # repository (review round 4 A08-01: the old language: node hook could not be installed). npx is replaced by a
    # stub that runs this checkout's dist/cli.js, so the job needs no registry and works before the version the hook
    # names is published; the stub fails on any other npx call.
    name: pre-commit hook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install pre-commit
        run: pipx install pre-commit==4.7.0
      - name: The hook installs and runs from this commit
        run: |
          set -euo pipefail
          pre-commit validate-manifest .pre-commit-hooks.yaml
          sha="$(git rev-parse HEAD)"
          stub="$RUNNER_TEMP/stub" && mkdir -p "$stub"
          cat > "$stub/npx" <<EOF
          #!/usr/bin/env bash
          [ "\$1" = --yes ] && [[ "\$2" == mcp-review-check@* ]] || { echo "unexpected npx \$*" >&2; exit 97; }
          echo "\$2" >> "$RUNNER_TEMP/npx-calls"
          shift 2
          exec node "$GITHUB_WORKSPACE/dist/cli.js" "\$@"
          EOF
          chmod +x "$stub/npx"
          fixture() {
            mkdir "$RUNNER_TEMP/fx-$1" && cd "$RUNNER_TEMP/fx-$1"
            git init -q && echo '{"mcpServers":{}}' > .mcp.json
            printf 'repos:\n  - repo: %s\n    rev: %s\n    hooks:\n      - id: mcp-review-check\n        args: [--target, claude, --stdio, --, node, %s]\n' \
              "$GITHUB_WORKSPACE" "$sha" "$GITHUB_WORKSPACE/test/fixtures/$1-server.mjs" > .pre-commit-config.yaml
            git add . && git -c user.name=ci -c user.email=ci@example.invalid commit -qm fixture
          }
          export PRE_COMMIT_HOME="$RUNNER_TEMP/pre-commit-home" PATH="$stub:$PATH"
          fixture good
          pre-commit run --all-files
          fixture bad
          if pre-commit run --all-files; then echo "::error::the hook passed a server with errors"; exit 1; fi
          cd "$GITHUB_WORKSPACE"
          # The hook ran twice, both times with the version the action runs by default.
          want="mcp-review-check@$(sed -n "/^  version:/,/default:/s/^ *default: '\(.*\)'$/\1/p" action.yml)"
          test "$(sort -u "$RUNNER_TEMP/npx-calls")" = "$want"
          test "$(wc -l < "$RUNNER_TEMP/npx-calls")" -eq 2

  action:
    # The composite action in action.yml, on every OS (its script runs in bash, also bash 3.2 on macOS and Git Bash
    # on Windows).
    name: GitHub Action / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # cli-path runs this checkout instead of the npm release, so the action is tested with the code it ships next
      # to. No upload: a pull request from a fork cannot write code scanning results.
      - name: A clean server passes
        id: good
        uses: ./
        with:
          stdio: node test/fixtures/good-server.mjs
          cli-path: dist/cli.js
          sarif-file: good.sarif
          upload-sarif: 'false'
      - name: A server with errors fails with exit code 1 and still writes the SARIF report
        id: bad
        continue-on-error: true
        uses: ./
        with:
          stdio: node test/fixtures/bad-server.mjs
          platform: claude
          cli-path: dist/cli.js
          sarif-file: bad.sarif
          upload-sarif: 'false'
      - name: Outputs follow the exit-code contract
        shell: bash
        env:
          GOOD_CODE: ${{ steps.good.outputs.exit-code }}
          GOOD_SARIF: ${{ steps.good.outputs.sarif-file }}
          BAD_CODE: ${{ steps.bad.outputs.exit-code }}
          BAD_SARIF: ${{ steps.bad.outputs.sarif-file }}
          BAD_OUTCOME: ${{ steps.bad.outcome }}
          GOOD_SCORE: ${{ steps.good.outputs.score }}
          GOOD_VERDICT: ${{ steps.good.outputs.verdict }}
          GOOD_ERRORS: ${{ steps.good.outputs.errors }}
          GOOD_NEW: ${{ steps.good.outputs.new-findings }}
          GOOD_JSON: ${{ steps.good.outputs.report-json }}
          BAD_VERDICT: ${{ steps.bad.outputs.verdict }}
          BAD_CLAUDE: ${{ steps.bad.outputs.verdict-claude }}
          BAD_ERRORS: ${{ steps.bad.outputs.errors }}
        run: |
          echo "good: exit $GOOD_CODE, $GOOD_SARIF; bad: exit $BAD_CODE ($BAD_OUTCOME), $BAD_SARIF"
          echo "good: score $GOOD_SCORE, $GOOD_VERDICT, $GOOD_ERRORS errors, $GOOD_NEW new; bad: $BAD_VERDICT, claude $BAD_CLAUDE, $BAD_ERRORS errors"
          # One check per line: bash -e does not stop on a failed command before the last && of a list.
          test "$GOOD_CODE" = 0
          test "$GOOD_SARIF" = good.sarif
          test "$BAD_CODE" = 1
          test "$BAD_SARIF" = bad.sarif
          test "$BAD_OUTCOME" = failure
          # The report outputs (--json-output): a numeric score and a verdict for the clean server, FAIL with errors
          # for the bad one, even though its run step failed.
          [[ "$GOOD_SCORE" =~ ^[0-9]+$ ]]
          test -n "$GOOD_VERDICT"
          test "$GOOD_VERDICT" = PASS
          test "$GOOD_ERRORS" = 0
          [[ "$GOOD_NEW" =~ ^[0-9]+$ ]]
          test -n "$GOOD_JSON"
          test "$BAD_VERDICT" = FAIL
          test "$BAD_CLAUDE" = BLOCKED
          [[ "$BAD_ERRORS" =~ ^[1-9][0-9]*$ ]]
          node -e "for (const f of process.argv.slice(1)) { const s = JSON.parse(require('fs').readFileSync(f, 'utf8')); if (s.version !== '2.1.0' || !s.runs?.length) throw new Error(f + ' is not a SARIF 2.1.0 report') }" good.sarif bad.sarif
