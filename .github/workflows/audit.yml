name: Audit

# npm audit of the runtime dependencies, off the pull-request path (a new advisory is not a pull request's fault):
# weekly, on demand, and on every push to main in ci.yml. A failed scheduled run notifies the maintainer.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (runtime dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      # npm audit reads package-lock.json: no install, so no dependency code runs.
      - run: npm audit --omit=dev --audit-level=high
