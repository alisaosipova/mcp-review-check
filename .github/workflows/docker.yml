name: Docker image

# Push a tag like v0.5.0: release.yml publishes the npm package; when that Release run succeeds (workflow_run), this
# workflow builds ghcr.io/alisaosipova/mcp-review-check:<version> (and :latest for a final release) from the PUBLISHED
# package (Dockerfile, build-arg VERSION), from the tagged commit. A Release run that failed (guard, tests, publish,
# provenance) builds no image, and the release has already waited until the registry serves the version, so the image
# contains what npm users get. The image is built ONCE, for linux/amd64 and linux/arm64, into a registry that lives only on the build
# runner; every platform is smoke-tested by that digest, and the push job copies the same image, by digest, to
# ghcr.io and checks the digest it pushed. Only the push job can write packages; it builds, installs and runs nothing.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alisaosipova/mcp-review-check

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only a successful Release run of a tag push in this repository (not a fork's, not a failed or cancelled one).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      version: ${{ steps.v.outputs.version }}
    services:
      # registry:2 (2.8.3), pinned by digest (multi-arch index, resolved 2026-11-04). Reachable on the runner only.
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      # A workflow_run run's GITHUB_REF and GITHUB_SHA are main's: the tag and its commit come from the Release run.
      # The tag is checked before any use (it reaches the shell only through env).
      - name: Version
        id: v
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::the Release run is not for a version tag: $TAG"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the Release run has no commit sha"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # The Release run waited until the registry served the version; one look, no polling.
      - name: The version is on npm
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          [ "$(npm view "mcp-review-check@$VERSION" version 2>/dev/null)" = "$VERSION" ] || { echo "::error::mcp-review-check@$VERSION is not on the npm registry, although the Release run succeeded"; exit 1; }
      # docker/* actions: SHAs of the newest tags listed by `ls-remote` on 2026-11-03 (setup-qemu-action on 2026-11-04).
      # QEMU runs the arm64 variant on the amd64 runner, for the build and for the smoke test.
      # The two privileged images these actions run are pinned by digest like every other image here (review round 4
      # A08-04); without them the actions pull tonistiigi/binfmt:latest and moby/buildkit:buildx-stable-1. Both are
      # multi-arch index digests read from registry-1.docker.io on 2026-11-05 (qemu-v10.2.3, v0.34.2). Refresh them
      # with the other pins (the Dockerfile base image, registry:2): look up the newest tag's index digest, e.g.
      # `docker buildx imagetools inspect moby/buildkit:<tag>`, and update the tag and date in these comments.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      # network=host: BuildKit reaches the runner's registry on localhost:5000.
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      # The only build of the image. OCI media types, so the archive below keeps every manifest byte for byte.
      - id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=registry,name=localhost:5000/mcp-review-check:test,oci-mediatypes=true
          build-args: VERSION=${{ steps.v.outputs.version }}
      - name: Image digest
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build reported no image digest"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      # Every platform of that digest: the version matches the tag, the CPU is the platform's, the installed
      # dependency tree is the package's npm-shrinkwrap.json (scripts/check-tree.mjs of the tagged commit), a
      # listing-only run exits 0, a report can be written into a host mount as the runner's user, the default user is
      # not root.
      - name: Smoke test
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          version="$VERSION"
          image="localhost:5000/mcp-review-check@$DIGEST"
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            case "$platform" in linux/amd64) arch=x86_64 ;; linux/arm64) arch=aarch64 ;; esac
            run() { docker run --rm --pull always --platform "$platform" "$@"; }
            run "$image" --version | grep -F "$version"
            [ "$(run --entrypoint uname "$image" -m)" = "$arch" ]
            run -v "$PWD/scripts:/scripts:ro" --entrypoint node "$image" /scripts/check-tree.mjs /usr/local/lib/node_modules/mcp-review-check
            # Listing-only run: no network, read-only mount.
            run -v "$PWD/test/fixtures/listing:/listing:ro" "$image" --plugin-dir /listing/plugin-valid
            # The documented recipe for writing a report: --user as the host user, a host folder mounted at /out.
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out"
            run --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/out:/out" -v "$PWD/test/fixtures/listing:/listing:ro" "$image" \
              --plugin-dir /listing/plugin-valid --format json --output /out/report.json
            test -s "$RUNNER_TEMP/out/report.json"
            # The image must not run as root.
            uid="$(run --entrypoint id "$image" -u)"
            echo "container uid: $uid"
            [ "$uid" != "0" ]
            echo "::endgroup::"
          done
      # The tested image, every platform, as an OCI archive; --preserve-digests fails rather than change a manifest.
      - name: Export the tested image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          command -v skopeo > /dev/null || { echo "::error::skopeo is not installed on this runner"; exit 1; }
          skopeo copy --all --preserve-digests --src-tls-verify=false \
            "docker://localhost:5000/mcp-review-check@$DIGEST" "oci-archive:$RUNNER_TEMP/image.tar"
          [ "sha256:$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/image.tar" | sha256sum | cut -d' ' -f1)" = "$DIGEST" ]
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  push:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's GITHUB_TOKEN
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation for the pushed digest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: image
          path: ${{ runner.temp }}/image
      # Copies the archive the build job tested, after checking it is still that digest, then checks what ghcr.io serves.
      - name: Push the tested image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::the build job passed no version"; exit 1; }
          archive="$RUNNER_TEMP/image/image.tar"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build job passed no image digest"; exit 1; }
          command -v skopeo > /dev/null || { echo "::error::skopeo is not installed on this runner"; exit 1; }
          [ "sha256:$(skopeo inspect --raw "oci-archive:$archive" | sha256sum | cut -d' ' -f1)" = "$DIGEST" ]
          tags="$version"
          # A pre-release (v0.6.0-rc.1) does not move :latest.
          case "$version" in *-*) ;; *) tags="$tags latest" ;; esac
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'skopeo logout ghcr.io || true' EXIT
          for tag in $tags; do
            skopeo copy --all --preserve-digests "oci-archive:$archive" "docker://$IMAGE:$tag"
            pushed="sha256:$(skopeo inspect --raw "docker://$IMAGE:$tag" | sha256sum | cut -d' ' -f1)"
            [ "$pushed" = "$DIGEST" ] || { echo "::error::$IMAGE:$tag is $pushed, not the tested $DIGEST"; exit 1; }
            echo "$IMAGE:$tag -> $DIGEST"
          done
      # A build provenance attestation for the digest that was tested and pushed, stored with the image on ghcr.io and
      # in the repository's attestations (review round 4 I-A08-2). Verify with
      # `gh attestation verify oci://ghcr.io/alisaosipova/mcp-review-check:<version> --owner alisaosipova`.
      # push-to-registry reads the Docker credentials, so the job logs Docker in for this step only.
      - name: Log Docker in to ghcr.io for the attestation
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # SHA of the newest tag (v4.2.2) listed by `git ls-remote` on 2026-11-05.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - name: Log Docker out
        if: always()
        run: docker logout ghcr.io || true
