name: Docker image

# Push a tag like v0.5.0: release.yml publishes the npm package, this workflow then builds
# ghcr.io/alisaosipova/mcp-review-check:<version> (and :latest for a final release) from the PUBLISHED package
# (Dockerfile, build-arg VERSION). It waits until the registry serves that version, so the image never contains
# anything other than what npm users get. Only the push job can write packages; it installs and runs no project code.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alisaosipova/mcp-review-check

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # release.yml publishes in parallel; the registry can take minutes to serve a new version.
      - name: Wait for the npm release
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 60); do
            if [ "$(npm view "mcp-review-check@$version" version 2>/dev/null)" = "$version" ]; then exit 0; fi
            echo "attempt $attempt: mcp-review-check@$version is not on the registry yet"
            sleep 30
          done
          echo "::error::mcp-review-check@$version was not published to npm within 30 minutes"
          exit 1
      # docker/* actions: SHAs of the newest tags listed by `ls-remote` on 2026-11-03 (checked offline from the tag list only).
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      # Build and smoke-test locally (no push): the version matches the tag, a listing-only run exits 0, the user is not root.
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          push: false
          tags: mcp-review-check:test
          build-args: VERSION=${{ steps.v.outputs.version }}
      - name: Smoke test
        run: |
          version="${GITHUB_REF_NAME#v}"
          image=mcp-review-check:test
          docker run --rm "$image" --version | grep -F "$version"
          # Listing-only run: no network, read-only mount.
          docker run --rm -v "$PWD/test/fixtures/listing:/listing:ro" "$image" --plugin-dir /listing/plugin-valid
          # The image must not run as root.
          uid="$(docker run --rm --entrypoint id "$image" -u)"
          echo "container uid: $uid"
          [ "$uid" != "0" ]

  push:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's GITHUB_TOKEN
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="$IMAGE:$version"
          # A pre-release (v0.6.0-rc.1) does not move :latest.
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
