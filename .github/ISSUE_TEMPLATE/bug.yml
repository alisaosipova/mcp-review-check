name: Bug
description: The CLI crashed, hung, printed something wrong or exited with the wrong code.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: mcp-review-check version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version and OS
      placeholder: Node 22.11.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, with tokens and header values removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: stderr and the report; `--verbose` adds the redacted HTTP trace. Review it for secrets first.
      render: text
